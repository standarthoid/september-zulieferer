<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>September – Zulieferer &amp; Drehplan</title>
<style>
  :root{
    --bg:#F6F2E9; --bg-card:#FDFBF6; --bg-sunk:#EFEADE;
    --ink:#18150F; --ink-soft:#4B4339; --ink-muted:#8A8073;
    --line:#E4DBC7; --line-strong:#CFC3A5;
    --green:#2F5344; --green-soft:#E0EAE1;
    --terra:#AE4E2F; --terra-soft:#F2DED2;
    --gold:#B89A5A; --gold-soft:#F4EAD0;
    --blue:#3B5A78; --blue-soft:#DEE7EE;
    --pink:#C23B8A; --pink-soft:#FBE3F3;
    --shadow:0 1px 2px rgba(40,30,10,0.04),0 4px 14px rgba(40,30,10,0.03);
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Georgia',serif;font-weight:600;margin:0}
  a{color:var(--green)}
  button{font:inherit;cursor:pointer}
  code{background:var(--bg-sunk);padding:1px 5px;border-radius:5px;font-size:12px}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:6px}

  /* ---- Layout ---- */
  #app{min-height:100vh;display:flex;flex-direction:column}
  header.topbar{position:sticky;top:0;z-index:20;background:var(--bg-card);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px}
  header.topbar .brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
  header.topbar .brand b{font-family:Georgia,serif;font-size:17px}
  header.topbar .brand span{font-size:11px;color:var(--ink-muted)}
  nav.tabs{display:flex;gap:4px;flex:1;overflow-x:auto}
  nav.tabs button{border:none;background:transparent;padding:8px 12px;border-radius:10px;color:var(--ink-soft);font-size:13.5px;white-space:nowrap;display:flex;align-items:center;gap:6px}
  nav.tabs button.active{background:var(--green-soft);color:var(--green);font-weight:600}
  nav.tabs button:hover:not(.active){background:var(--bg-sunk)}
  .icon{width:16px;height:16px;flex:none;display:inline-flex;align-items:center;justify-content:center;vertical-align:-3px}
  .icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8}
  .topbar-right{display:flex;align-items:center;gap:8px}
  #sync-indicator{font-size:11px;color:var(--ink-muted);display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:8px}
  #sync-indicator.err{color:var(--terra)}
  #sync-indicator.ok{color:var(--green)}
  .iconbtn{border:1px solid var(--line);background:var(--bg-card);width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
  .iconbtn:hover{background:var(--bg-sunk)}

  main{flex:1;padding:18px;max-width:1180px;margin:0 auto;width:100%}
  .view{display:none}
  .view.active{display:block;animation:fade .15s ease}
  @keyframes fade{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}

  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row.between{justify-content:space-between}
  .grow{flex:1}
  .card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:16px}
  .stack{display:flex;flex-direction:column;gap:12px}
  .divider{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-muted);margin:14px 0 6px;font-weight:600}

  .btn{border:1px solid var(--line-strong);background:var(--bg-card);color:var(--ink);padding:9px 14px;border-radius:10px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--bg-sunk)}
  .btn-primary{background:var(--green);border-color:var(--green);color:#fff}
  .btn-primary:hover{background:#25422f}
  .btn-green{background:var(--green-soft);border-color:var(--green);color:var(--green)}
  .btn-block{width:100%;justify-content:center}
  .btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
  .btn-ghost{border-color:transparent;background:transparent}
  .btn-ghost:hover{background:var(--bg-sunk)}
  .btn-danger{color:var(--terra);border-color:var(--terra-soft)}
  .btn-danger:hover{background:var(--terra-soft)}

  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--ink-soft);font-weight:600}
  .field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--bg-card);border-radius:9px;padding:9px 10px;font:inherit;color:var(--ink)}
  .field textarea{resize:vertical;min-height:60px}
  .field .hint{font-size:11px;color:var(--ink-muted)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media(max-width:560px){.field-row,.field-row3{grid-template-columns:1fr}}
  .info-box{background:var(--gold-soft);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft)}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
  .pill.dreh{background:var(--terra-soft);color:var(--terra)}
  .pill.frei{background:var(--bg-sunk);color:var(--ink-muted)}
  .pill.unit{background:var(--blue-soft);color:var(--blue)}
  .pill.status-geplant{background:var(--gold-soft);color:#8a6d1f}
  .pill.status-bestaetigt{background:var(--green-soft);color:var(--green)}
  .pill.status-erledigt{background:var(--bg-sunk);color:var(--ink-muted)}
  .pill.status-abgesagt{background:var(--terra-soft);color:var(--terra)}

  .empty{padding:40px 20px;text-align:center;color:var(--ink-muted)}
  .empty .icon{width:34px;height:34px;margin:0 auto 10px;opacity:.5}

  /* ---- Dashboard / Kalender ---- */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-head h2{font-size:19px}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{font-size:11px;color:var(--ink-muted);text-align:center;padding-bottom:4px;font-weight:600}
  .cal-day{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;min-height:92px;padding:6px;display:flex;flex-direction:column;gap:4px;cursor:pointer;position:relative;overflow:hidden}
  .cal-day:hover{border-color:var(--line-strong)}
  .cal-day.out{opacity:.35}
  .cal-day.today{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
  .cal-day .dnum{font-size:12px;font-weight:700;color:var(--ink-soft)}
  .cal-day .dloc{font-size:10.5px;background:var(--terra-soft);color:var(--terra);border-radius:6px;padding:2px 5px;line-height:1.25;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .cal-day .dfrei{font-size:10px;color:var(--ink-muted);font-style:italic}
  .cal-day .dappt{font-size:10px;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:1.5px 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-day .dappt.status-geplant{background:var(--gold-soft);color:#8a6d1f}
  .cal-day .dappt.status-bestaetigt{background:var(--green-soft);color:var(--green)}
  .cal-day .dappt.status-erledigt{background:var(--bg-sunk);color:var(--ink-muted)}
  .cal-day .dappt.status-abgesagt{background:var(--terra-soft);color:var(--terra);text-decoration:line-through}
  .cal-day .dmore{font-size:10px;color:var(--ink-muted)}
  .cal-day .dap{font-size:10px;color:var(--gold);display:flex;align-items:center;gap:3px}
  .cal-day .dap .icon{width:11px;height:11px}
  .cal-day .dap-off{font-size:10px;color:var(--pink);font-weight:600}
  .pill.dayoff{background:var(--pink-soft);color:var(--pink)}
  tr.ap-off td{background:var(--pink-soft)}
  @media(max-width:720px){
    .cal-grid{grid-template-columns:1fr}
    .cal-dow{display:none}
    .cal-day{min-height:0;flex-direction:row;align-items:center;gap:8px}
    .cal-day .dnum{min-width:60px}
    .cal-day .dloc,.cal-day .dappt{display:inline-block;-webkit-line-clamp:1}
  }

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  @media(max-width:720px){.kpi-row{grid-template-columns:1fr 1fr}}
  .kpi{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
  .kpi .n{font-family:Georgia,serif;font-size:24px}
  .kpi .l{font-size:11.5px;color:var(--ink-muted)}

  /* ---- Zulieferer ---- */
  .supplier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .supplier-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:8px}
  .supplier-card:hover{border-color:var(--line-strong)}
  .supplier-card .sname{font-family:Georgia,serif;font-size:16px}
  .supplier-card .scat{font-size:11px;color:var(--green);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .supplier-card .smeta{font-size:12px;color:var(--ink-muted);display:flex;flex-direction:column;gap:2px}
  .supplier-card .sfoot{display:flex;gap:8px;font-size:11px;color:var(--ink-muted);margin-top:2px}

  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
  .contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:13px}
  @media(max-width:560px){.contact-grid{grid-template-columns:1fr}}
  .contact-grid .ci{display:flex;gap:8px;align-items:flex-start}
  .contact-grid .ci .icon{margin-top:2px;color:var(--ink-muted)}

  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
  .photo-thumb{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--bg-sunk);position:relative;overflow:hidden;cursor:pointer}
  .photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-thumb .pcap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:10px;padding:10px 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .photo-thumb .pdel{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0}
  .photo-thumb:hover .pdel{opacity:1}
  .drop-zone{border:1.5px dashed var(--line-strong);border-radius:12px;padding:16px;text-align:center;background:var(--bg-sunk);cursor:pointer}
  .drop-zone:hover{border-color:var(--ink)}
  .drop-zone.drag{border-color:var(--green);background:var(--green-soft)}

  .appt-list{display:flex;flex-direction:column;gap:8px}
  .appt-item{border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:var(--bg-card)}
  .appt-item .adate{font-weight:700;font-size:13px;min-width:64px}
  .appt-item .abody{flex:1;min-width:0}
  .appt-item .atitle{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .appt-item .asub{font-size:11.5px;color:var(--ink-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .appt-actions{display:flex;gap:4px}

  /* ---- Drehplan Tabelle ---- */
  table.dp-table{width:100%;border-collapse:collapse;font-size:12.5px}
  table.dp-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-muted);padding:6px 8px;border-bottom:1px solid var(--line-strong)}
  table.dp-table td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.dp-table tr:hover td{background:var(--bg-sunk)}
  table.dp-table input,table.dp-table select{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 5px;font:inherit;color:inherit}
  table.dp-table input:hover,table.dp-table select:hover,table.dp-table input:focus,table.dp-table select:focus{border-color:var(--line-strong);background:var(--bg-card)}
  .dp-wrap{overflow-x:auto}
  .dp-actions{width:1%;white-space:nowrap}

  /* ---- Modal ---- */
  .modal-bg{position:fixed;inset:0;background:rgba(20,16,8,.42);display:flex;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(2px)}
  @media(min-width:720px){.modal-bg{align-items:center}}
  .modal{background:var(--bg-card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  @media(min-width:720px){.modal{border-radius:16px}}
  .modal-head{position:sticky;top:0;background:var(--bg-card);display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);z-index:2}
  .modal-head h3{font-size:17px}
  .modal-body{padding:18px}
  .modal-foot{position:sticky;bottom:0;background:var(--bg-card);padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px}

  .settings-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
  .settings-tabs button{border:none;background:transparent;padding:9px 4px;font-size:13px;color:var(--ink-muted);white-space:nowrap;border-bottom:2px solid transparent}
  .settings-tabs button.active{color:var(--ink);border-color:var(--green);font-weight:600}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  .toggle{display:flex;align-items:center;gap:10px;cursor:pointer}
  .toggle input{display:none}
  .toggle .switch{width:36px;height:21px;background:var(--line-strong);border-radius:99px;position:relative;flex:none;transition:background .15s}
  .toggle .switch::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;background:#fff;border-radius:50%;transition:transform .15s}
  .toggle input:checked + .switch{background:var(--green)}
  .toggle input:checked + .switch::after{transform:translateX(15px)}
  .toggle .label .t{font-size:13px;font-weight:600}
  .toggle .label .sub{font-size:11.5px;color:var(--ink-muted)}

  .search-bar{display:flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--bg-card);border-radius:10px;padding:7px 10px}
  .search-bar input{border:none;background:transparent;flex:1;font:inherit;outline:none}

  .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:10px;color:var(--ink-muted);font-size:13px}

  /* ---- Motivblätter ---- */
  .mb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .mb-card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:6px}
  .mb-card:hover{border-color:var(--line-strong)}
  .mb-card .mbname{font-family:Georgia,serif;font-size:16px}
  .mb-card .mbmeta{font-size:12px;color:var(--ink-muted)}
  .mb-untermotiv-card{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg-card);margin-bottom:10px}
  .mb-photo-edit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-bottom:8px}
  .mb-photo-edit-item{display:flex;flex-direction:column}
  .mb-contact-card{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--bg-sunk)}
  .mb-logo-preview{width:100%;max-height:90px;object-fit:contain;background:var(--bg-sunk);border-radius:8px;padding:8px}

  /* Druck-/Vorschau-Blatt: bewusst eigenes Farbschema, das die Vorlage nachbildet */
  .mb-print-wrap{background:#e9edf0;padding:24px 0;min-height:100vh}
  .mb-sheet{width:210mm;max-width:94vw;min-height:297mm;margin:0 auto 24px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.15);padding:14mm 12mm;box-sizing:border-box;font-family:Georgia,'Times New Roman',serif;color:var(--mb-textcolor,#1a1a1a)}
  .diamond-banner{height:26px;background-repeat:repeat-x;background-size:auto 100%;background-color:#fff;border:1px solid #bfe3f5}
  .mb-pattern-preview{height:32px;width:100%;background-repeat:repeat-x;background-size:auto 100%;border:1px solid var(--line);border-radius:8px}
  .mb-title{text-align:center;font-style:var(--mb-italic,italic);text-decoration:var(--mb-underline,none);font-size:calc(38px * var(--mb-scale,1));margin:10px 0;font-weight:var(--mb-weight,600)}
  .mb-motiv-box{border:2px solid #6fb8dd;border-radius:2px;padding:10px 16px;margin:14px 0;text-align:center}
  .mb-motiv-box h2{font-style:var(--mb-italic,italic);text-decoration:var(--mb-underline,none);font-size:calc(26px * var(--mb-scale,1));font-weight:var(--mb-weight,600);margin:0}
  .mb-info-row{display:flex;gap:14px;margin-bottom:14px}
  .mb-address-box{flex:1;border:1px solid #6fb8dd;border-radius:2px;padding:12px 14px;font-size:calc(13px * var(--mb-scale,1));line-height:1.5}
  .mb-logo-box{width:220px;flex:none;border:1px solid #6fb8dd;border-radius:2px;padding:12px;display:flex;align-items:center;justify-content:center}
  .mb-logo-box img{max-width:100%;max-height:90px;object-fit:contain}
  .mb-label{font-size:calc(12px * var(--mb-scale,1))}
  .mb-bold{font-weight:700}
  .mb-untermotiv-box{border:2px solid #6fb8dd;border-radius:4px;background:var(--mb-boxbg,#eaf6fc);padding:14px;margin-bottom:16px}
  .mb-untermotiv-head{background:#fff;border:1px solid #6fb8dd;border-radius:2px;padding:6px 14px;margin-bottom:12px}
  .mb-untermotiv-head h3{font-style:var(--mb-italic,italic);text-decoration:var(--mb-underline,none);font-size:calc(22px * var(--mb-scale,1));font-weight:var(--mb-weight,600);margin:0}
  .mb-ref{font-size:calc(12px * var(--mb-scale,1));color:#444}
  .mb-photo-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .mb-photo{width:100%;page-break-inside:avoid;break-inside:avoid}
  .mb-photo img{width:100%;height:140px;object-fit:cover;border-radius:2px;display:block}
  .mb-caption{font-size:calc(11px * var(--mb-scale,1));color:#333;margin-top:3px;text-align:center}
  .mb-notes{font-size:calc(13px * var(--mb-scale,1));line-height:1.5;margin:0;padding-left:18px}
  .mb-notes li{margin-bottom:4px}
  .mb-sheet-toolbar{max-width:210mm;margin:0 auto 12px;display:flex;justify-content:space-between;gap:8px}

  @page{size:A4;margin:0}
  @media print{
    header.topbar, .no-print{display:none!important}
    main{padding:0!important;max-width:none!important}
    .mb-print-wrap{background:#fff;padding:0}
    .mb-sheet{box-shadow:none;margin:0 auto;page-break-after:always;break-after:page;max-width:none;width:210mm;min-height:297mm}
  }
</style>
</head>
<body>
<div id="loading" class="loading-screen"><div style="font-family:Georgia,serif;font-size:20px;color:var(--ink)">September</div><div>lädt…</div></div>
<div id="app" style="display:none">
  <header class="topbar">
    <div class="brand"><b>September</b><span>Zulieferer &amp; Drehplan</span></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="topbar-right">
      <div id="sync-indicator"></div>
      <button class="iconbtn" data-action="open-settings" title="Einstellungen"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L15 3h-6l-.3 2.4a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1L9 21h6l.3-2.4a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6z" stroke-linejoin="round"/></svg></span></button>
    </div>
  </header>
  <main>
    <div class="view" id="view-dashboard"></div>
    <div class="view" id="view-suppliers"></div>
    <div class="view" id="view-supplier-detail"></div>

/* ---------------------------- Storage (IndexedDB) ---------------------------- */
const appStorage = (function(){
  const DB_NAME='september_zulieferer', STORE='kv', DB_VERSION=1;
  let dbPromise=null;
  function openDB(){
    if(!dbPromise){
      dbPromise=new Promise((resolve,reject)=>{
        if(typeof indexedDB==='undefined'){reject(new Error('IndexedDB nicht verfügbar'));return;}
        const req=indexedDB.open(DB_NAME,DB_VERSION);
        req.onupgradeneeded=()=>{ if(!req.result.objectStoreNames.contains(STORE)) req.result.createObjectStore(STORE); };
        req.onsuccess=()=>resolve(req.result);
        req.onerror=()=>reject(req.error);
      });
    }
    return dbPromise;
  }
  return {
    async get(key){
      const db=await openDB();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,'readonly');
        const req=tx.objectStore(STORE).get(key);
        req.onsuccess=()=>{ const v=req.result; resolve(v!==undefined?{key,value:v}:null); };
        req.onerror=()=>reject(req.error);
      });
    },
    async set(key,value){
      const db=await openDB();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,'readwrite');
        const req=tx.objectStore(STORE).put(value,key);
        req.onsuccess=()=>resolve({key,value});
        req.onerror=()=>reject(req.error);
      });
    },
    async delete(key){
      const db=await openDB();
      return new Promise((resolve,reject)=>{
        const tx=db.transaction(STORE,'readwrite');
        const req=tx.objectStore(STORE).delete(key);
        req.onsuccess=()=>resolve({key,deleted:true});
        req.onerror=()=>reject(req.error);
      });
    },
  };
})();

function escapeHtml(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeAttr(s){return escapeHtml(s);}
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast');

}
function fmtDate(iso,opts){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('de-DE',opts||{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateLong(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('de-DE',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
}
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isoToDate(iso){return new Date(iso+'T00:00:00');}
function dateToISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function downloadFile(filename,content,mime){
  const blob=new Blob([content],{type:mime||'text/plain'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},400);
}
function debounce(fn,ms){let t;return (...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms);};}

/* ============================================================
   DROPBOX-SYNC
   PKCE-Flow mit offline-Scope für Refresh-Tokens.
   Kein Client-Secret, kein Redirect-URI-Setup nötig (Code wird
   manuell zurückkopiert) — funktioniert daher rein statisch.
   ============================================================ */
const DBX_API = 'https://api.dropboxapi.com/2';
const DBX_CONTENT = 'https://content.dropboxapi.com/2';
const DBX_AUTH_URL = 'https://www.dropbox.com/oauth2/authorize';
const DBX_TOKEN_URL = 'https://api.dropboxapi.com/oauth2/token';

function dbxRandomString(len=64){
  const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  const arr=new Uint8Array(len); crypto.getRandomValues(arr);
  return Array.from(arr,b=>chars[b%chars.length]).join('');
}
async function dbxChallenge(verifier){
  const enc=new TextEncoder().encode(verifier);
  const hash=await crypto.subtle.digest('SHA-256',enc);
  const bytes=new Uint8Array(hash);
  let s=''; for(const b of bytes) s+=String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

async function dbxStartAuth(){
  const appKey=state.settings.dbxAppKey?.trim();
  if(!appKey){toast('Bitte App-Key eingeben');return;}
  const win=window.open('about:blank','_blank');
  try{
    const verifier=dbxRandomString(64);
    state.dbx.pkceVerifier=verifier;
    await appStorage.set('_dbxPkceVerifier', verifier);
    await appStorage.set('_dbxAuthPending', '1');
    const challenge=await dbxChallenge(verifier);
    const url=`${DBX_AUTH_URL}?client_id=${encodeURIComponent(appKey)}`
      +`&response_type=code&code_challenge=${challenge}&code_challenge_method=S256`
      +`&token_access_type=offline`;
    // Code-Eingabefeld sofort einblenden — die Dropbox-Seite öffnet sich in einem
    // neuen Tab, der ursprüngliche Tab lädt dabei NICHT neu, daher darf das Feld
    // nicht erst auf einen Reload warten.
    state._dbxPending=true;
    if(state.settingsOpen) renderSettingsModal();
    if(win && !win.closed){
      win.location.href=url;
      toast('Dropbox in neuem Tab geöffnet. Code dort kopieren und unten einfügen.');
    } else {
      toast('Pop-ups blockiert – öffne Dropbox im gleichen Tab…');
      setTimeout(()=>{window.location.href=url;},900);
    }
  }catch(e){
    if(win && !win.closed) win.close();
    toast('Fehler beim Vorbereiten: '+e.message);
  }
}

async function dbxFinishAuth(code){
  if(!code){toast('Bitte Autorisierungs-Code einfügen');return;}
  const appKey=state.settings.dbxAppKey?.trim();
  let verifier=state.dbx.pkceVerifier;
  if(!verifier){ try{ const r=await appStorage.get('_dbxPkceVerifier'); if(r?.value) verifier=r.value; }catch(e){} }
  if(!verifier){toast('PKCE-Verifier verloren – bitte neu starten');return;}
  const body=new URLSearchParams({ code:code.trim(), grant_type:'authorization_code', client_id:appKey, code_verifier:verifier });
  try{
    const res=await fetch(DBX_TOKEN_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
    if(!res.ok){const t=await res.text();throw new Error('Token-Tausch fehlgeschlagen: '+t);}
    const data=await res.json();
    if(!data.refresh_token) throw new Error('Kein Refresh-Token erhalten – App im "offline"-Modus registriert?');
    state.settings.dbxRefreshToken=data.refresh_token;
    state.dbx.accessToken=data.access_token;
    state.dbx.accessTokenExpires=Date.now()+(data.expires_in||14400)*1000-60000;
    await saveSettings();
    try{ await appStorage.delete('_dbxPkceVerifier'); }catch(e){}
    state.dbx.pkceVerifier=null; state._dbxPending=false;
    toast('Dropbox verbunden! Lade Daten …');
    const loaded=await dbxLoadFromCloud();
    if(!loaded) await dbxSaveToCloud(true);
    render();
  }catch(e){toast('Fehler: '+e.message);}
}

async function dbxGetAccessToken(){
  const now=Date.now();
  if(state.dbx.accessToken && state.dbx.accessTokenExpires>now) return state.dbx.accessToken;
  const appKey=state.settings.dbxAppKey?.trim();
  const rt=state.settings.dbxRefreshToken;
  if(!appKey||!rt) throw new Error('Nicht mit Dropbox verbunden');
  const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:rt,client_id:appKey});
  const res=await fetch(DBX_TOKEN_URL,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
  if(!res.ok){const t=await res.text();throw new Error('Refresh fehlgeschlagen: '+t);}
  const data=await res.json();
  state.dbx.accessToken=data.access_token;
  state.dbx.accessTokenExpires=now+(data.expires_in||14400)*1000-60000;
  return state.dbx.accessToken;
}
function dbxConnected(){ return !!(state.settings.dbxAppKey && state.settings.dbxRefreshToken); }

function dbxBuildPayload(){
  return {
    format:'sep_zulieferer_sync_v1', savedAt:new Date().toISOString(),
    device:navigator.userAgent.includes('iPhone')?'iPhone':navigator.userAgent.includes('Mac')?'Mac':navigator.userAgent.includes('Android')?'Android':'Browser',
    suppliers:state.suppliers, appointments:state.appointments, photos:state.photos, drehplan:state.drehplan, arbeitsplan:state.arbeitsplan, motivblaetter:state.motivblaetter,
    // Nur die nicht-sensiblen Anzeige-Einstellungen mitsynchronisieren, niemals die Dropbox-Zugangsdaten selbst
    settings:{ companyLogo:state.settings.companyLogo, headerPattern:state.settings.headerPattern, defaultProjectTitle:state.settings.defaultProjectTitle, motivblattStyle:state.settings.motivblattStyle },
  };
}
async function dbxSaveToCloud(force=false){
  if(!dbxConnected()) return false;
  if(state.dbx.syncStatus==='saving'&&!force) return false;
  state.dbx.syncStatus='saving'; state.dbx.lastError=null; updateSyncIndicator();
  try{
    const token=await dbxGetAccessToken();
    const payload=dbxBuildPayload();
    const body=new Blob([JSON.stringify(payload)],{type:'application/octet-stream'});
    const apiArg={path:state.settings.dbxPath||'/september-zulieferer-daten.json',mode:'overwrite',mute:true,autorename:false};
    const res=await fetch(`${DBX_CONTENT}/files/upload`,{method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/octet-stream','Dropbox-API-Arg':JSON.stringify(apiArg)}, body});
    if(!res.ok){const t=await res.text();throw new Error('Upload: '+t);}
    state.dbx.lastSync=new Date().toISOString(); state.dbx.syncStatus='idle'; updateSyncIndicator();
    return true;
  }catch(e){ state.dbx.syncStatus='error'; state.dbx.lastError=e.message; updateSyncIndicator(); return false; }
}
async function dbxLoadFromCloud(){
  if(!dbxConnected()) return false;
  state.dbx.syncStatus='loading'; state.dbx.lastError=null; updateSyncIndicator();
  try{
    const token=await dbxGetAccessToken();
    const apiArg={path:state.settings.dbxPath||'/september-zulieferer-daten.json'};
    const res=await fetch(`${DBX_CONTENT}/files/download`,{method:'POST',
      headers:{'Authorization':'Bearer '+token,'Dropbox-API-Arg':JSON.stringify(apiArg)}});
    if(res.status===409){ state.dbx.syncStatus='idle'; updateSyncIndicator(); return false; }
    if(!res.ok){const t=await res.text();throw new Error('Download: '+t);}
    const data=JSON.parse(await res.text());
    if(data.format!=='sep_zulieferer_sync_v1') throw new Error('Ungültiges Sync-Format');
    if(Array.isArray(data.suppliers)) state.suppliers=data.suppliers;
    if(Array.isArray(data.appointments)) state.appointments=data.appointments;
    if(Array.isArray(data.photos)) state.photos=data.photos;
    if(Array.isArray(data.drehplan)) state.drehplan=data.drehplan;
    if(Array.isArray(data.arbeitsplan)) state.arbeitsplan=data.arbeitsplan;
    if(Array.isArray(data.motivblaetter)) state.motivblaetter=data.motivblaetter;
    if(data.settings){
      if(data.settings.companyLogo!=null) state.settings.companyLogo=data.settings.companyLogo;
      if(data.settings.headerPattern!=null) state.settings.headerPattern=data.settings.headerPattern;
      if(data.settings.defaultProjectTitle!=null) state.settings.defaultProjectTitle=data.settings.defaultProjectTitle;
      if(data.settings.motivblattStyle!=null) state.settings.motivblattStyle={...DEFAULT_MB_STYLE,...data.settings.motivblattStyle};
    }
    await saveSuppliers(); await saveAppointments(); await savePhotos(); await saveDrehplan(); await saveArbeitsplan(); await saveMotivblaetter(); await saveSettings();
    state.dbx.lastSync=new Date().toISOString(); state.dbx.syncStatus='idle'; updateSyncIndicator();
    return true;
  }catch(e){ state.dbx.syncStatus='error'; state.dbx.lastError=e.message; updateSyncIndicator(); return false; }
}
function dbxTriggerSave(){
  if(!dbxConnected()||!state.settings.dbxAutoSync) return;
  if(state.dbx.saveTimer) clearTimeout(state.dbx.saveTimer);
  state.dbx.saveTimer=setTimeout(()=>{dbxSaveToCloud();},1500);
}
async function dbxDisconnect(){
  if(!confirm('Dropbox-Verbindung trennen? Deine Daten bleiben lokal und in Dropbox erhalten.'))return;
  state.settings.dbxRefreshToken=''; state.dbx.accessToken=null; state.dbx.accessTokenExpires=0;
  state.dbx.lastSync=null; state.dbx.syncStatus='idle';
  await saveSettings(); toast('Dropbox getrennt'); renderSettingsModal();
}
function updateSyncIndicator(){
  const el=document.getElementById('sync-indicator'); if(!el) return;
  const s=state.dbx.syncStatus;
  if(!dbxConnected()){ el.className=''; el.innerHTML=''; return; }
  if(s==='saving'||s==='loading'){ el.className=''; el.innerHTML=ic('sync')+' '+(s==='saving'?'Speichert…':'Lädt…'); return; }
  if(s==='error'){ el.className='err'; el.innerHTML=ic('sync')+' Sync-Fehler'; el.title=state.dbx.lastError||''; return; }
  el.className='ok'; el.innerHTML=ic('check')+' Synchron';
}

/* ---------------------------- Fotos ---------------------------- */
function compressImage(file,maxDim,quality){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width,height}=img;
      if(width>maxDim||height>maxDim){
        if(width>height){height=Math.round(height*maxDim/width);width=maxDim;}
        else{width=Math.round(width*maxDim/height);height=maxDim;}
      }
      const c=document.createElement('canvas'); c.width=width; c.height=height;
      const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,width,height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve(b):reject(new Error('Komprimierung fehlgeschlagen')),'image/jpeg',quality);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Bild konnte nicht gelesen werden'));};
    img.src=url;
  });
}
function resizeImageToPNG(file,maxDim){
  // Verlustfrei (PNG statt JPEG) — wichtig für scharfe Muster/Logos statt Fotos
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      let {width,height}=img;
      if(width>maxDim||height>maxDim){
        if(width>height){height=Math.round(height*maxDim/width);width=maxDim;}
        else{width=Math.round(width*maxDim/height);height=maxDim;}
      }
      const c=document.createElement('canvas'); c.width=width; c.height=height;
      const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,width,height);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?resolve(b):reject(new Error('Konvertierung fehlgeschlagen')),'image/png');
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('Bild konnte nicht gelesen werden'));};
    img.src=url;
  });
}
function blobToBase64(blob){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(blob);});}
function base64ToBlob(dataURL){
  const [head,b64]=dataURL.split(',');
  const mime=/data:(.*?);/.exec(head)?.[1]||'image/jpeg';
  const bin=atob(b64); const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr],{type:mime});
}

async function addPhotos(files,meta={}){
  const added=[];
  for(const file of files){
    if(!file.type.startsWith('image/')) continue;
    try{
      const fullBlob=await compressImage(file,1600,0.82);
      const thumbBlob=await compressImage(file,320,0.68);
      const thumbDataURL=await blobToBase64(thumbBlob);
      const id=uid();
      const ext='jpg';
      await appStorage.set('photoblob:'+id, await blobToBase64(fullBlob));
      const photo={
        id, caption:'', thumb:thumbDataURL, mime:'image/jpeg', uploadedAt:new Date().toISOString(), dropboxPath:null,
        supplierId:meta.supplierId||null, appointmentId:meta.appointmentId||null,
        motivblattId:meta.motivblattId||null, untermotivId:meta.untermotivId||null,
      };
      state.photos.push(photo);
      added.push(photo);
      if(dbxConnected()){
        const path=(state.settings.dbxPhotosFolder||'/fotos')+'/'+id+'.'+ext;
        dbxUploadBinary(path,fullBlob).then(()=>{ photo.dropboxPath=path; savePhotos(); updateSyncIndicator(); })
          .catch(err=>{ console.warn('Foto-Sync fehlgeschlagen',err); });
      }
    }catch(e){ console.warn('Foto übersprungen',e); }
  }
  if(added.length) await savePhotos();
  return added;
}
async function addPhotosToSupplier(files,supplierId,appointmentId){
  return (await addPhotos(files,{supplierId,appointmentId})).length;
}
async function deletePhoto(id){
  const p=state.photos.find(x=>x.id===id); if(!p) return;
  if(!confirm('Dieses Foto wirklich löschen?')) return;
  state.photos=state.photos.filter(x=>x.id!==id);

      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},

async function getPhotoFullSrc(photo){
  try{ const r=await appStorage.get('photoblob:'+photo.id); if(r?.value) return r.value; }catch(e){}
  if(photo.dropboxPath && dbxConnected()){
    try{
      const blob=await dbxDownloadBinary(photo.dropboxPath);
      const dataURL=await blobToBase64(blob);
      await appStorage.set('photoblob:'+photo.id, dataURL);
      return dataURL;
    }catch(e){ console.warn('Foto-Download fehlgeschlagen',e); }
  }
  return photo.thumb;
}

/* ---------------------------- ICS-Kalenderexport ---------------------------- */
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
function icsDateAllDay(iso){return iso.replace(/-/g,'');}
function icsDateTime(iso,time){
  const t=(time||'09:00').replace(':','')+'00';
  return iso.replace(/-/g,'')+'T'+t;
}
function buildICS(events){
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//September Zulieferer Tool//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  for(const ev of events){
    lines.push('BEGIN:VEVENT');
    lines.push('UID:'+ev.uid);
    lines.push('DTSTAMP:'+stamp);
    if(ev.allDay){
      lines.push('DTSTART;VALUE=DATE:'+icsDateAllDay(ev.date));
      lines.push('DTEND;VALUE=DATE:'+icsDateAllDay(ev.endDate||ev.date));
    }else{
      lines.push('DTSTART:'+icsDateTime(ev.date,ev.startTime));
      lines.push('DTEND:'+icsDateTime(ev.date,ev.endTime||addHour(ev.startTime)));
    }
    lines.push('SUMMARY:'+icsEscape(ev.title));
    if(ev.location) lines.push('LOCATION:'+icsEscape(ev.location));
    if(ev.description) lines.push('DESCRIPTION:'+icsEscape(ev.description));
    lines.push('END:VEVENT');
  }
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function addHour(time){
  const [h,m]=(time||'09:00').split(':').map(Number);
  const d=new Date(2000,0,1,h,m); d.setHours(d.getHours()+1);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function apptToICSEvent(a){
  const supplier=state.suppliers.find(s=>s.id===a.supplierId);
  const descParts=[];
  if(a.notes) descParts.push(a.notes);
  if(supplier){
    descParts.push('Zulieferer: '+supplier.name);
    if(supplier.contactPerson) descParts.push('Kontakt: '+supplier.contactPerson);
    if(supplier.phone) descParts.push('Tel: '+supplier.phone);
    if(supplier.email) descParts.push('E-Mail: '+supplier.email);
  }
  return {
    uid:'appt-'+a.id+'@september-zulieferer',
    title:(supplier?supplier.name+' – ':'')+a.title,
    date:a.date, startTime:a.startTime, endTime:a.endTime,
    allDay:!a.startTime,
    location:a.location||(supplier?supplier.address:'')||'',
    description:descParts.join('\n'),
  };
}
function dpToICSEvent(d){
  const locs=[d.mainLocation,...(d.additionalLocations||[])].filter(Boolean);
  const label=d.type==='dreh-frei'?'Drehfrei':(d.type==='2nd-unit'?'2nd Unit':d.type==='3rd-unit'?'3rd Unit':'Drehtag');
  return {
    uid:'dp-'+d.id+'@september-zulieferer',
    title:(d.day?label+' '+d.day:label)+(d.mainLocation?': '+d.mainLocation:''),
    date:d.date, allDay:true,
    location:d.mainLocation||'',
    description:[d.additionalLocations?.length?('Motivwechsel: '+d.additionalLocations.join(' / ')):'',d.note||''].filter(Boolean).join('\n'),
  };
}
function exportAppointmentICS(id){
  const a=state.appointments.find(x=>x.id===id); if(!a) return;
  const ics=buildICS([apptToICSEvent(a)]);

function drehplanForDate(iso){ return state.drehplan.filter(d=>d.date===iso); }
function appointmentsForDate(iso){ return state.appointments.filter(a=>a.date===iso).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||'')); }

function dpPillClass(type){ return type==='dreh-frei'?'frei':(type&&type.includes('unit'))?'unit':'dreh'; }

function renderDashboard(){

          <button class="btn btn-sm" data-action="cal-today">Heute</button>
          <button class="iconbtn" data-action="cal-next">${ic('chevR')}</button>
        </div>
      </div>
      ${renderCalGrid()}
    </div>

    ${upcoming.length? `<div class="appt-list">${upcoming.map(a=>renderApptItem(a)).join('')}</div>` : `<div class="empty">${ic('calendar')}<div>Noch keine anstehenden Termine</div></div>`}
  `;
}
function renderCalGrid(){
  const first=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth(),1);
  const startOffset=(first.getDay()+6)%7;
  const gridStart=new Date(first); gridStart.setDate(1-startOffset);
  const today=todayISO();
  const DOW=['Mo','Di','Mi','Do','Fr','Sa','So'];
  let cells=DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const iso=dateToISO(d);
    const inMonth=d.getMonth()===state.calMonth.getMonth();
    const dp=drehplanForDate(iso);
    const appts=appointmentsForDate(iso);
    const shootEntries=dp.filter(x=>x.type!=='dreh-frei');
    const freeEntry=dp.find(x=>x.type==='dreh-frei');
    let locHtml='';
    if(shootEntries.length){
      const label=shootEntries.map(x=>(x.day&&x.day!=='-'?('DT '+x.day+': '):'')+(x.mainLocation||dpTypeLabel(x.type))).join(' · ');
      locHtml=`<div class="dloc" title="${escapeAttr(label)}">${escapeHtml(label)}</div>`;
    } else if(freeEntry){
      locHtml=`<div class="dfrei">Drehfrei</div>`;
    }
    const apptHtml=appts.slice(0,2).map(a=>`<div class="dappt status-${a.status}">${escapeHtml((a.startTime?a.startTime+' ':'')+apptSupplierName(a))}</div>`).join('');
    const moreHtml=appts.length>2?`<div class="dmore">+${appts.length-2} mehr</div>`:'';
    const ap=arbeitsplanForDate(iso);
    const apWorking=ap.filter(x=>!x.dayOff), apOff=ap.filter(x=>x.dayOff);
    const apHtml=apWorking.length?`<div class="dap">${ic('clock')} ${apWorking.length} im Einsatz</div>`:'';
    const apOffHtml=apOff.length?`<div class="dap-off">🌸 ${apOff.length} frei (${apOff.map(x=>x.person).join(', ')})</div>`:'';
    cells+=`<div class="cal-day${inMonth?'':' out'}${iso===today?' today':''}" data-action="open-day" data-date="${iso}">
      <div class="dnum">${d.getDate()}</div>${locHtml}${apptHtml}${moreHtml}${apHtml}${apOffHtml}
    </div>`;
  }
  return `<div class="cal-grid">${cells}</div>`;
}
function renderApptItem(a){
  const s=state.suppliers.find(x=>x.id===a.supplierId);
  return `<div class="appt-item">
    <div class="adate">${fmtDate(a.date,{day:'2-digit',month:'2-digit'})}</div>
    <div class="abody">
      <div class="atitle">${escapeHtml(a.title)}${s?' · '+escapeHtml(s.name):''}</div>

function bindSupplierDetailEvents(supplierId){
  const zone=document.getElementById('photo-drop');
  const input=document.getElementById('photo-file');
  if(!zone) return;
  zone.addEventListener('click',()=>input.click());
  input.addEventListener('change',async e=>{
    const files=Array.from(e.target.files);
    if(files.length){ const n=await addPhotosToSupplier(files,supplierId,null); toast(n+' Foto(s) hinzugefügt'); render(); }
    input.value='';
  });
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
  zone.addEventListener('drop',async e=>{
    e.preventDefault(); zone.classList.remove('drag');
    const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
    if(files.length){ const n=await addPhotosToSupplier(files,supplierId,null); toast(n+' Foto(s) hinzugefügt'); render(); }
  });
}

function updateApptResults(){
  const q=state.apptSearch.trim().toLowerCase();

  let list=state.appointments.slice();
  if(state.apptFilter==='upcoming') list=list.filter(a=>a.date>=t);

function bindDrehplanEvents(){
  const importInp=document.getElementById('dp-import-file');
  if(importInp) importInp.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) importDrehplanFile(f); importInp.value=''; });
  const table=document.getElementById('dp-table'); if(!table) return;
  table.querySelectorAll('tr[data-id]').forEach(tr=>{
    const id=tr.dataset.id;
    tr.querySelectorAll('[data-field]').forEach(inp=>{
      const evt=inp.tagName==='SELECT'?'change':'input';
      inp.addEventListener(evt,()=>{
        const row=state.drehplan.find(x=>x.id===id); if(!row) return;
        const field=inp.dataset.field;
        if(field==='additionalLocations') row[field]=inp.value.split('/').map(s=>s.trim()).filter(Boolean);
        else row[field]=inp.value;
        debouncedSaveDrehplan();
      });
    });
  });
}
const debouncedSaveDrehplan=debounce(()=>saveDrehplan(),700);
function addDrehplanRow(dateOverride){
  const row={id:uid(),day:'',date:dateOverride||todayISO(),weekday:'',type:'dreh',mainLocation:'',additionalLocations:[],note:''};
  state.drehplan.push(row); saveDrehplan(); render();
}
function deleteDrehplanRow(id){
  if(!confirm('Diese Drehplan-Zeile löschen?')) return;
  state.drehplan=state.drehplan.filter(x=>x.id!==id); saveDrehplan(); render();
}

function updateApResults(){
  const q=(state.apSearch||'').trim().toLowerCase();
  let rows=state.arbeitsplan.slice();
  if(q) rows=rows.filter(x=>[x.person,x.status,x.note].filter(Boolean).some(v=>v.toLowerCase().includes(q)));
  rows.sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.person||'').localeCompare(b.person||'','de'));
  document.getElementById('ap-results').innerHTML = rows.length ? `<div class="card"><div class="dp-wrap"><table class="dp-table" id="ap-table">
      <thead><tr><th>Person / Rolle</th><th>Datum</th><th>Status / Tätigkeit</th><th>Notiz</th><th>🌸 Frei</th><th></th></tr></thead>
      <tbody>${rows.map(renderApRow).join('')}</tbody>
    </table></div></div>` : `<div class="empty">${ic('clock')}<div>${q?'Keine Treffer':'Noch kein Arbeitsplan erfasst'}</div></div>`;
  bindApTableEvents();
}

    <div class="modal-body stack">

      <div class="field-row">

      </div>
      <div class="field"><label>Status</label><input id="fr-status" value="Frei"></div>
      <div class="hint">Legt für jeden Tag im Zeitraum (inkl. Wochenende) einen Arbeitsplan-Eintrag als „frei" an. Für diese Person schon vorhandene Tage werden nicht doppelt angelegt.</div>
    </div>
    <div class="modal-foot">
      <button class="btn grow" data-action="close-modal">Abbrechen</button>

async function saveFreiRange(){
  const person=document.getElementById('fr-person').value.trim();
  const start=document.getElementById('fr-start').value;
  const end=document.getElementById('fr-end').value;
  const status=document.getElementById('fr-status').value.trim()||'Frei';
  if(!person){toast('Bitte Person/Rolle eingeben');return;}
  if(!start||!end){toast('Bitte Zeitraum eingeben');return;}
  if(end<start){toast('„Bis" liegt vor „Von"');return;}
  const existing=new Set(state.arbeitsplan.filter(x=>x.person===person).map(x=>x.date));
  let d=isoToDate(start); const endD=isoToDate(end); let added=0, skipped=0;
  while(d<=endD){
    const iso=dateToISO(d);
    if(existing.has(iso)){ skipped++; }
    else{ state.arbeitsplan.push({id:uid(),person,date:iso,status,note:'',dayOff:true}); added++; }
    d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);
  }
  await saveArbeitsplan();
  closeModal(); toast(added+' Tag(e) eingetragen'+(skipped?' · '+skipped+' schon vorhanden':'')); render();
}

function bindMotivblattEditEvents(mb){
  const proj=document.getElementById('mbf-project');
  if(proj) proj.addEventListener('input',()=>{ mb.projectTitle=proj.value; debouncedSaveMotivblaetter(); });
  const name=document.getElementById('mbf-name');
  if(name) name.addEventListener('input',()=>{ mb.motivName=name.value; debouncedSaveMotivblaetter(); });
  const addr=document.getElementById('mbf-address');
  if(addr) addr.addEventListener('input',()=>{ mb.address=addr.value; debouncedSaveMotivblaetter(); });

  document.querySelectorAll('#mbf-contacts .mb-contact-card').forEach(row=>{
    const idx=+row.dataset.idx;
    row.querySelectorAll('[data-cfield]').forEach(inp=>{
      inp.addEventListener('input',()=>{ mb.contacts[idx][inp.dataset.cfield]=inp.value; debouncedSaveMotivblaetter(); });
    });
  });

  const logoInput=document.getElementById('mbf-logo-file');
  if(logoInput) logoInput.addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const blob=await compressImage(f,500,0.85);
      const dataUrl=await blobToBase64(blob);
      mb.logoDataUrl=dataUrl;
      state.settings.companyLogo=dataUrl;
      await saveMotivblaetter(); await saveSettings();
      render();
    }catch(err){ toast('Logo konnte nicht geladen werden'); }
    logoInput.value='';
  });

  const patternInput=document.getElementById('mbf-pattern-file');
  if(patternInput) patternInput.addEventListener('change',async e=>{
    const f=e.target.files[0]; if(!f) return;
    try{
      const blob=await resizeImageToPNG(f,1400);
      const dataUrl=await blobToBase64(blob);
      state.settings.headerPattern=dataUrl;
      await saveSettings();
      render();
      toast('Header-Muster aktualisiert');
    }catch(err){ toast('Muster konnte nicht geladen werden'); }
    patternInput.value='';
  });

  const mbs=()=>{ state.settings.motivblattStyle=state.settings.motivblattStyle||{...DEFAULT_MB_STYLE}; return state.settings.motivblattStyle; };
  const mbFont=document.getElementById('mbf-font');
  if(mbFont) mbFont.addEventListener('change',()=>{ mbs().fontKey=mbFont.value; debouncedSaveSettings(); });
  const mbScale=document.getElementById('mbf-scale');
  if(mbScale) mbScale.addEventListener('change',()=>{ mbs().fontSizeScale=parseFloat(mbScale.value); debouncedSaveSettings(); });
  const mbWeight=document.getElementById('mbf-weight');
  if(mbWeight) mbWeight.addEventListener('change',()=>{ mbs().headingWeight=parseInt(mbWeight.value,10); debouncedSaveSettings(); });
  const mbItalic=document.getElementById('mbf-italic');
  if(mbItalic) mbItalic.addEventListener('change',()=>{ mbs().headingItalic=mbItalic.checked; debouncedSaveSettings(); });
  const mbUnderline=document.getElementById('mbf-underline');
  if(mbUnderline) mbUnderline.addEventListener('change',()=>{ mbs().headingUnderline=mbUnderline.checked; debouncedSaveSettings(); });
  const mbTextcolor=document.getElementById('mbf-textcolor');
  if(mbTextcolor) mbTextcolor.addEventListener('input',()=>{ mbs().textColor=mbTextcolor.value; debouncedSaveSettings(); });
  const mbBoxcolor=document.getElementById('mbf-boxcolor');
  if(mbBoxcolor) mbBoxcolor.addEventListener('input',()=>{ mbs().boxBgColor=mbBoxcolor.value; debouncedSaveSettings(); });
  const mbOpacity=document.getElementById('mbf-opacity');
  if(mbOpacity) mbOpacity.addEventListener('input',()=>{
    mbs().boxBgOpacity=mbOpacity.value/100;
    const lbl=document.getElementById('mbf-opacity-val'); if(lbl) lbl.textContent=mbOpacity.value+'%';
    debouncedSaveSettings();
  });

  document.querySelectorAll('#mbf-untermotive .mb-untermotiv-card').forEach(card=>{
    const uidVal=card.dataset.uid;
    const u=(mb.untermotive||[]).find(x=>x.id===uidVal); if(!u) return;
    card.querySelectorAll('[data-ufield]').forEach(inp=>{
      inp.addEventListener('input',()=>{ u[inp.dataset.ufield]=inp.value; debouncedSaveMotivblaetter(); });
    });
    card.querySelectorAll('[data-caption-id]').forEach(inp=>{
      inp.addEventListener('input',()=>{
        const p=state.photos.find(x=>x.id===inp.dataset.captionId); if(!p) return;
        p.caption=inp.value; debouncedSavePhotos();
      });
    });
    const zone=card.querySelector('.drop-zone');
    const fileInp=card.querySelector('.mb-photo-file');
    if(zone&&fileInp){
      zone.addEventListener('click',()=>fileInp.click());
      fileInp.addEventListener('change',async e=>{
        const files=Array.from(e.target.files);
        if(files.length){ await addPhotos(files,{motivblattId:mb.id,untermotivId:uidVal}); toast(files.length+' Foto(s) hinzugefügt'); render(); }
        fileInp.value='';
      });
      zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag');});
      zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));
      zone.addEventListener('drop',async e=>{
        e.preventDefault(); zone.classList.remove('drag');
        const files=Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/'));
        if(files.length){ await addPhotos(files,{motivblattId:mb.id,untermotivId:uidVal}); toast(files.length+' Foto(s) hinzugefügt'); render(); }
      });
    }
  });
}

}
function deleteUntermotiv(uidVal){
  if(!confirm('Dieses Untermotiv inkl. seiner Fotos löschen?')) return;
  const mb=state.motivblaetter.find(x=>x.id===state.activeMotivblattId); if(!mb) return;
  const photoIds=state.photos.filter(p=>p.motivblattId===mb.id&&p.untermotivId===uidVal).map(p=>p.id);

  saveMotivblaetter(); savePhotos(); render();

async function upgradeMotivblattPrintPhotos(){

// Fotos werden nie verkleinert. Erste Seite eines Untermotivs trägt den vollen Kopf
// (Titel/Motiv/Adresse/Logo) und hat daher weniger Platz für Fotos; Fortsetzungsseiten
// zeigen nur noch den Untermotiv-Kasten und fassen entsprechend mehr Fotos.
const MB_PHOTOS_FIRST_PAGE = 6;
const MB_PHOTOS_CONT_PAGE = 12;
function renderMotivblattPrint(){
  const el=document.getElementById('view-motivblatt-print');
  const mb=state.motivblaetter.find(x=>x.id===state.printMotivblattId);
  if(!mb){ el.innerHTML=`<div class="empty">Motivblatt nicht gefunden</div>`; return; }
  const untermotive=(mb.untermotive&&mb.untermotive.length)?mb.untermotive:[{id:'_leer',title:'',ref:'',notes:''}];
  const sheets=[];
  untermotive.forEach(u=>{
    const photos=u.id==='_leer'?[]:state.photos.filter(p=>p.motivblattId===mb.id&&p.untermotivId===u.id);
    const chunks=[];
    if(photos.length<=MB_PHOTOS_FIRST_PAGE){
      chunks.push(photos);
    }else{
      chunks.push(photos.slice(0,MB_PHOTOS_FIRST_PAGE));
      let rest=photos.slice(MB_PHOTOS_FIRST_PAGE);
      while(rest.length){
        chunks.push(rest.slice(0,MB_PHOTOS_CONT_PAGE));
        rest=rest.slice(MB_PHOTOS_CONT_PAGE);
      }
    }
    chunks.forEach((chunk,idx)=>{
      const hideHeader=idx>0;
      const uPart=chunks.length>1
        ? {...u, title:(u.title||'')+` (Fortsetzung ${idx+1}/${chunks.length})`, notes:idx===0?u.notes:''}
        : u;
      sheets.push(renderMotivblattSheetHTML(mb,uPart,chunk,hideHeader));
    });
  });
  el.innerHTML=`
    <div class="mb-print-wrap">
      <div class="mb-sheet-toolbar no-print">
        <button class="btn btn-sm" data-action="set-view" data-view="motivblatt-edit">${ic('back')} Zurück zum Bearbeiten</button>
        <button class="btn btn-primary btn-sm" data-action="do-print">${ic('download')} Als PDF drucken/speichern</button>
      </div>
      <div class="info-box no-print" style="max-width:210mm;margin:0 auto 12px">Jede Seite ist fix im DIN-A4-Format. Fotos werden nie verkleinert, um mehr auf eine Seite zu quetschen — bei zu vielen Fotos pro Untermotiv wird automatisch eine Fortsetzungsseite angelegt (ohne Kopfbereich, dafür mit mehr Platz für Fotos). Beim Drucken/Speichern als PDF bitte „Skalierung: 100 %" wählen (nicht „An Seite anpassen"), damit das erhalten bleibt.</div>
      ${sheets.join('')}
    </div>
  `;
}
function hexToRgb(hex){
  hex=(hex||'#eaf6fc').replace('#','');
  if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
  const num=parseInt(hex,16)||0;
  return {r:(num>>16)&255, g:(num>>8)&255, b:num&255};
}
function ensureGoogleFont(font){
  if(!font||!font.google) return;
  const id='gf-'+font.key;
  if(document.getElementById(id)) return;
  const link=document.createElement('link');
  link.id=id; link.rel='stylesheet';
  link.href='https://fonts.googleapis.com/css2?family='+font.google+'&display=swap';
  document.head.appendChild(link);
}
function motivblattStyleAttr(){
  const s=state.settings.motivblattStyle||DEFAULT_MB_STYLE;
  const font=MB_FONTS.find(f=>f.key===s.fontKey)||MB_FONTS[0];
  ensureGoogleFont(font);
  const scale=s.fontSizeScale||1;
  const weight=s.headingWeight||600;
  const italic=s.headingItalic===false?'normal':'italic';
  const underline=s.headingUnderline?'underline':'none';
  const textColor=s.textColor||'#1a1a1a';
  const rgb=hexToRgb(s.boxBgColor||'#eaf6fc');
  const opacity=(s.boxBgOpacity!=null?s.boxBgOpacity:1);
  const boxBg=`rgba(${rgb.r},${rgb.g},${rgb.b},${opacity})`;
  return `font-family:${font.css};color:${textColor};--mb-scale:${scale};--mb-weight:${weight};--mb-italic:${italic};--mb-underline:${underline};--mb-textcolor:${textColor};--mb-boxbg:${boxBg}`;
}
function renderMotivblattSheetHTML(mb,u,photosOverride,hideHeader){
  const contacts=mb.contacts||[];
  const addressLines=(mb.address||'').split('\n').filter(Boolean);
  const photos=photosOverride||(u.id==='_leer'?[]:state.photos.filter(p=>p.motivblattId===mb.id&&p.untermotivId===u.id));
  const notesLines=(u.notes||'').split('\n').map(l=>l.trim()).filter(Boolean);
  const logo=mb.logoDataUrl||state.settings.companyLogo;
  const patternStyle=state.settings.headerPattern?` style="background-image:url('${escapeAttr(state.settings.headerPattern)}')"`:'';
  const headerHtml=hideHeader?'':`
    <div class="diamond-banner"${patternStyle}></div>
    <div class="mb-title">${escapeHtml(mb.projectTitle||'September')}</div>
    <div class="diamond-banner"${patternStyle}></div>
    <div class="mb-motiv-box"><h2>Motiv: ${escapeHtml(mb.motivName||'')}</h2></div>
    <div class="mb-info-row">
      <div class="mb-address-box">
        ${addressLines.length?`<div class="mb-label">Motiv-Adresse:</div>${addressLines.map((l,i)=>`<div${i===0?' class="mb-bold"':''}>${escapeHtml(l)}</div>`).join('')}`:''}
        ${contacts.length?`<div class="mb-label" style="margin-top:${addressLines.length?'10px':'0'}">${contacts.length>1?'Ansprechpartner*innen:':'Ansprechpartner*in:'}</div>
          ${contacts.map(c=>`<div style="margin-top:6px">${c.role?`<div class="mb-bold">${escapeHtml(c.role)}:</div>`:''}<span class="mb-bold">${escapeHtml(c.name||'')}</span>${c.phone?': '+escapeHtml(c.phone):''}${c.email?`<br>${escapeHtml(c.email)}`:''}${c.address?`<br>${escapeHtml(c.address)}`:''}</div>`).join('')}`:''}
      </div>
      <div class="mb-logo-box">${logo?`<img src="${logo}">`:''}</div>
    </div>`;
  return `<div class="mb-sheet" style="${escapeAttr(motivblattStyleAttr())}">
    ${headerHtml}
    ${(u.title||u.ref||photos.length||notesLines.length)?`<div class="mb-untermotiv-box">
      <div class="mb-untermotiv-head"><h3>${escapeHtml(u.title||'')}</h3>${u.ref?`<div class="mb-ref">${escapeHtml(u.ref)}</div>`:''}</div>
      ${photos.length?`<div class="mb-photo-row">${photos.map(p=>`<div class="mb-photo"><img data-photo-id="${p.id}" src="${p.thumb}">${p.caption?`<div class="mb-caption">${escapeHtml(p.caption)}</div>`:''}</div>`).join('')}</div>`:''}
      ${notesLines.length?`<ul class="mb-notes">${notesLines.map(l=>`<li>${escapeHtml(l.replace(/^[-•]\s*/,''))}</li>`).join('')}</ul>`:''}
    </div>`:''}
  </div>`;
}

function bindSettingsEvents(){
  const key=document.getElementById('s-dbxkey');
  if(key) key.addEventListener('change',()=>{ state.settings.dbxAppKey=key.value.trim(); saveSettings(); });
  const normPath=(v,fallback)=>{ v=(v||'').trim(); if(!v) return fallback; if(!v.startsWith('/')) v='/'+v; return v; };
  const pathInp=document.getElementById('s-dbxpath');
  if(pathInp) pathInp.addEventListener('change',()=>{ state.settings.dbxPath=normPath(pathInp.value,'/september-zulieferer-daten.json'); pathInp.value=state.settings.dbxPath; saveSettings(); });
  const photosInp=document.getElementById('s-dbxphotos');
  if(photosInp) photosInp.addEventListener('change',()=>{ state.settings.dbxPhotosFolder=normPath(photosInp.value,'/fotos').replace(/\/$/,''); photosInp.value=state.settings.dbxPhotosFolder; saveSettings(); });
  const auto=document.getElementById('s-dbxauto');
  if(auto) auto.addEventListener('change',()=>{ state.settings.dbxAutoSync=auto.checked; saveSettings(); });
  const fileInp=document.getElementById('backup-file');
  if(fileInp) fileInp.addEventListener('change',e=>{ const f=e.target.files[0]; if(f) importBackupFile(f); fileInp.value=''; });
}

  if(!confirm('Diesen Termin löschen?')) return;
  state.appointments=state.appointments.filter(x=>x.id!==id);
  saveAppointments(); toast('Termin gelöscht'); render();
}

function openDayModal(iso){
  const dp=drehplanForDate(iso);
  const appts=appointmentsForDate(iso);
  const ap=arbeitsplanForDate(iso).slice().sort((a,b)=>a.person.localeCompare(b.person,'de'));
  openModal(`
    <div class="modal-head"><h3>${fmtDateLong(iso)}</h3><button class="iconbtn" data-action="close-modal">${ic('close')}</button></div>
    <div class="modal-body stack">
      ${dp.length?`<div class="divider">Drehplan</div>${dp.map(d=>`
        <div class="card pad" style="margin-bottom:6px">
          <div class="row between"><b>${d.day&&d.day!=='-'?dpTypeLabel(d.type)+' '+escapeHtml(d.day):dpTypeLabel(d.type)}</b><span class="pill ${dpPillClass(d.type)}">${dpTypeLabel(d.type)}</span></div>
          ${d.mainLocation?`<div style="margin-top:4px">${ic('pin')} ${escapeHtml(d.mainLocation)}</div>`:''}
          ${d.additionalLocations&&d.additionalLocations.length?`<div style="margin-top:4px;font-size:12px;color:var(--ink-muted)">Motivwechsel: ${escapeHtml(d.additionalLocations.join(' / '))}</div>`:''}
          ${d.note?`<div style="margin-top:4px;font-size:12px;color:var(--ink-muted)">${escapeHtml(d.note)}</div>`:''}
        </div>`).join('')}`:`<div class="info-box">Kein Drehplan-Eintrag für diesen Tag.<br><button class="btn btn-sm" style="margin-top:8px" data-action="add-dp-row-date" data-date="${iso}">${ic('plus')} Eintrag hinzufügen</button></div>`}
      ${ap.length?`<div class="divider">Arbeitsplan (wer arbeitet wo)</div>
        <div class="card pad">${ap.map(x=>`<div class="row between" style="padding:4px 0;border-bottom:1px solid var(--line)${x.dayOff?';background:var(--pink-soft);margin:0 -6px;padding-left:6px;padding-right:6px':''}"><b style="font-size:13px">${escapeHtml(x.person)}</b>${x.dayOff?`<span class="pill dayoff">🌸 Frei${x.status&&x.status.toLowerCase()!=='frei'?' · '+escapeHtml(x.status):''}</span>`:`<span style="font-size:12.5px;color:var(--ink-soft)">${escapeHtml(x.status)}${x.note?' · '+escapeHtml(x.note):''}</span>`}</div>`).join('')}</div>`:''}
      <div class="divider">Zulieferer-Termine</div>
      ${appts.length?`<div class="appt-list">${appts.map(a=>renderApptItem(a)).join('')}</div>`:`<div class="empty" style="padding:14px">Keine Termine an diesem Tag</div>`}
      <button class="btn btn-block" data-action="new-appt-date" data-date="${iso}">${ic('plus')} Termin an diesem Tag anlegen</button>
    </div>
  `);
}

async function openPhotoModal(id){
  const p=state.photos.find(x=>x.id===id); if(!p) return;
  openModal(`
    <div class="modal-head"><h3>Foto</h3><button class="iconbtn" data-action="close-modal">${ic('close')}</button></div>
    <div class="modal-body stack">
      <img id="photo-full-img" src="${p.thumb}" style="width:100%;border-radius:10px;background:var(--bg-sunk)">
      <div class="field"><label>Beschriftung</label><input id="f-photo-caption" value="${escapeAttr(p.caption||'')}" placeholder="z.B. Stoffmuster Vorhänge"></div>
      <div class="row" style="gap:8px">
        <button class="btn grow" data-action="save-photo-caption" data-id="${p.id}">Speichern</button>
        <button class="btn btn-danger grow" data-action="del-photo" data-id="${p.id}">${ic('trash')} Löschen</button>
      </div>
    </div>
  `);
  getPhotoFullSrc(p).then(src=>{ const img=document.getElementById('photo-full-img'); if(img) img.src=src; });
}
function savePhotoCaption(id){
  const p=state.photos.find(x=>x.id===id); if(!p) return;
  p.caption=document.getElementById('f-photo-caption').value.trim();
  savePhotos(); closeModal(); render(); toast('Gespeichert');
}

/* ---------------------------- Drehplan-Import (neue PDF-Fassung) ---------------------------- */
function exportDrehplanJSON(){
  const clean=state.drehplan.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(({id,...rest})=>rest);
  downloadFile('drehplan-'+todayISO()+'.json',JSON.stringify(clean,null,2),'application/json');
}
async function importDrehplanFile(file){
  try{
    const raw=JSON.parse(await file.text());
    const arr=Array.isArray(raw)?raw:(Array.isArray(raw.drehplan)?raw.drehplan:null);
    if(!arr) throw new Error('Erwarte ein JSON-Array mit Drehplan-Einträgen (oder {"drehplan":[...]})');
    const cleaned=arr.map(d=>({
      id:uid(),
      day:d.day!=null?String(d.day):'',
      date:d.date||'',
      weekday:d.weekday||'',
      type:DP_TYPES.some(t=>t.v===d.type)?d.type:'dreh',
      mainLocation:d.mainLocation||'',
      additionalLocations:Array.isArray(d.additionalLocations)?d.additionalLocations:(d.additionalLocations?String(d.additionalLocations).split('/').map(s=>s.trim()).filter(Boolean):[]),
      note:d.note||'',
    }));
    if(!confirm(`Aktuellen Drehplan (${state.drehplan.length} Einträge) durch diese Datei (${cleaned.length} Einträge) ersetzen?\n\nZulieferer, Termine und Fotos bleiben davon komplett unberührt.`)) return;
    state.drehplan=cleaned;
    await saveDrehplan();
    toast('Neuer Drehplan importiert ('+cleaned.length+' Einträge)');
    render();
  }catch(e){ toast('Fehler beim Import: '+e.message); }
}

/* ---------------------------- Arbeitsplan-Import (neue Fassung) ---------------------------- */
function exportArbeitsplanJSON(){
  const clean=state.arbeitsplan.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(({id,...rest})=>rest);
  downloadFile('arbeitsplan-'+todayISO()+'.json',JSON.stringify(clean,null,2),'application/json');
}
async function importArbeitsplanFile(file){
  try{
    const raw=JSON.parse(await file.text());
    const arr=Array.isArray(raw)?raw:(Array.isArray(raw.arbeitsplan)?raw.arbeitsplan:null);
    if(!arr) throw new Error('Erwarte ein JSON-Array mit Arbeitsplan-Einträgen (oder {"arbeitsplan":[...]})');
    const cleaned=arr.map(d=>({ id:uid(), person:d.person||'', date:d.date||'', status:d.status||'', note:d.note||'', dayOff:!!d.dayOff }));
    if(!confirm(`Aktuellen Arbeitsplan (${state.arbeitsplan.length} Einträge) durch diese Datei (${cleaned.length} Einträge) ersetzen?\n\nZulieferer, Termine und Fotos bleiben davon komplett unberührt.`)) return;
    state.arbeitsplan=cleaned;
    await saveArbeitsplan();
    toast('Neuer Arbeitsplan importiert ('+cleaned.length+' Einträge)');
    render();
  }catch(e){ toast('Fehler beim Import: '+e.message); }
}

/* ---------------------------- Backup Export/Import ---------------------------- */
function exportBackup(){
  const payload={format:'sep_zulieferer_backup_v1',savedAt:new Date().toISOString(),suppliers:state.suppliers,appointments:state.appointments,photos:state.photos,drehplan:state.drehplan,arbeitsplan:state.arbeitsplan,motivblaetter:state.motivblaetter,
    settings:{companyLogo:state.settings.companyLogo,headerPattern:state.settings.headerPattern,defaultProjectTitle:state.settings.defaultProjectTitle,motivblattStyle:state.settings.motivblattStyle}};
  downloadFile('september-zulieferer-backup-'+todayISO()+'.json',JSON.stringify(payload,null,2),'application/json');
}
async function importBackupFile(file){
  try{
    const data=JSON.parse(await file.text());
    if(!confirm('Aktuelle Daten in der App mit dem Inhalt dieser Sicherung überschreiben?')) return;
    if(Array.isArray(data.suppliers)) state.suppliers=data.suppliers;
    if(Array.isArray(data.appointments)) state.appointments=data.appointments;
    if(Array.isArray(data.photos)) state.photos=data.photos;
    if(Array.isArray(data.drehplan)) state.drehplan=data.drehplan;
    if(Array.isArray(data.arbeitsplan)) state.arbeitsplan=data.arbeitsplan;
    if(Array.isArray(data.motivblaetter)) state.motivblaetter=data.motivblaetter;
    if(data.settings){
      if(data.settings.companyLogo!=null) state.settings.companyLogo=data.settings.companyLogo;
      if(data.settings.headerPattern!=null) state.settings.headerPattern=data.settings.headerPattern;
      if(data.settings.defaultProjectTitle!=null) state.settings.defaultProjectTitle=data.settings.defaultProjectTitle;
      if(data.settings.motivblattStyle!=null) state.settings.motivblattStyle={...DEFAULT_MB_STYLE,...data.settings.motivblattStyle};
    }
    await saveSuppliers(); await saveAppointments(); await savePhotos(); await saveDrehplan(); await saveArbeitsplan(); await saveMotivblaetter(); await saveSettings();
    toast('Sicherung geladen'); closeModal(); render();
  }catch(e){ toast('Fehler beim Laden: '+e.message); }
}

/* ---------------------------- Globale Event-Delegation ---------------------------- */
document.addEventListener('click', async (e)=>{
  const t=e.target.closest('[data-action]'); if(!t) return;
  const action=t.dataset.action;
  switch(action){
    case 'noop': break;
    case 'modal-bg-close': closeModal(); break;
    case 'close-modal': closeModal(); break;
    case 'set-view': setView(t.dataset.view); break;
    case 'open-supplier': openSupplierDetail(t.dataset.id); break;
    case 'new-supplier': openSupplierForm(null); break;
    case 'edit-supplier': openSupplierForm(t.dataset.id); break;
    case 'save-supplier': saveSupplierForm(t.dataset.id||null); break;
    case 'del-supplier': deleteSupplier(t.dataset.id); break;
    case 'new-appt': openApptForm(null,{supplierId:t.dataset.supplier||state.activeSupplierId}); break;
    case 'new-appt-date': closeModal(); openApptForm(null,{date:t.dataset.date,supplierId:state.activeSupplierId}); break;
    case 'edit-appt': openApptForm(t.dataset.id); break;
    case 'save-appt': saveApptForm(t.dataset.id||null); break;
    case 'del-appt': deleteAppt(t.dataset.id); break;
    case 'ics-appt': exportAppointmentICS(t.dataset.id); break;
    case 'ics-all-appts': exportAllAppointmentsICS(); break;
    case 'ics-supplier-appts': exportSupplierAppointmentsICS(t.dataset.id); break;
    case 'ics-drehplan': exportDrehplanICS(); break;
    case 'ics-everything': exportEverythingICS(); break;
    case 'del-photo': deletePhoto(t.dataset.id); break;
    case 'open-photo': openPhotoModal(t.dataset.id); break;
    case 'save-photo-caption': savePhotoCaption(t.dataset.id); break;
    case 'open-day': openDayModal(t.dataset.date); break;
    case 'cal-prev': state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()-1,1); render(); break;
    case 'cal-next': state.calMonth=new Date(state.calMonth.getFullYear(),state.calMonth.getMonth()+1,1); render(); break;
    case 'cal-today': state.calMonth=new Date(new Date().getFullYear(),new Date().getMonth(),1); render(); break;
    case 'add-dp-row': addDrehplanRow(); break;
    case 'export-dp-json': exportDrehplanJSON(); break;
    case 'import-dp-json': document.getElementById('dp-import-file')?.click(); break;
    case 'add-dp-row-date': addDrehplanRow(t.dataset.date); closeModal(); setView('drehplan'); break;
    case 'del-dp-row': deleteDrehplanRow(t.dataset.id); break;
    case 'add-ap-row': addArbeitsplanRow(); break;
    case 'del-ap-row': deleteArbeitsplanRow(t.dataset.id); break;
    case 'export-ap-json': exportArbeitsplanJSON(); break;
    case 'import-ap-json': document.getElementById('ap-import-file')?.click(); break;
    case 'open-frei-range': openFreiRangeForm(); break;
    case 'save-frei-range': await saveFreiRange(); break;
    case 'new-motivblatt': openMotivblattForm(null); break;
    case 'edit-motivblatt': openMotivblattForm(t.dataset.id); break;
    case 'del-motivblatt': deleteMotivblatt(t.dataset.id); break;
    case 'print-motivblatt': await openMotivblattPrint(t.dataset.id); break;
    case 'add-contact-row': addContactRow(); break;
    case 'del-contact-row': delContactRow(+t.dataset.idx); break;
    case 'add-untermotiv': addUntermotiv(); break;
    case 'del-untermotiv': deleteUntermotiv(t.dataset.uid); break;
    case 'upload-logo': document.getElementById('mbf-logo-file')?.click(); break;
    case 'upload-header-pattern': document.getElementById('mbf-pattern-file')?.click(); break;
    case 'reset-header-pattern': state.settings.headerPattern=DEFAULT_HEADER_PATTERN; await saveSettings(); render(); toast('Standard-Rautenmuster wiederhergestellt'); break;
    case 'reset-mb-style': state.settings.motivblattStyle={...DEFAULT_MB_STYLE}; await saveSettings(); render(); toast('Design zurückgesetzt'); break;
    case 'do-print': window.print(); break;
    case 'open-settings': openSettings(); break;
    case 'settings-tab': state.settingsTab=t.dataset.tab; renderSettingsModal(); break;
    case 'dbx-start-auth': {
      const key=document.getElementById('s-dbxkey'); if(key) state.settings.dbxAppKey=key.value.trim();
      const p=document.getElementById('s-dbxpath'); if(p&&p.value.trim()) state.settings.dbxPath=p.value.trim().startsWith('/')?p.value.trim():'/'+p.value.trim();
      const pf=document.getElementById('s-dbxphotos'); if(pf&&pf.value.trim()) state.settings.dbxPhotosFolder=(pf.value.trim().startsWith('/')?pf.value.trim():'/'+pf.value.trim()).replace(/\/$/,'');
      await saveSettings(); await dbxStartAuth(); break;
    }
    case 'dbx-finish-auth': {
      const code=document.getElementById('s-dbxcode');
      await dbxFinishAuth(code?code.value.trim():''); renderSettingsModal(); break;
    }
    case 'dbx-pull': { const ok=await dbxLoadFromCloud(); toast(ok?'Aus Dropbox geladen':'Keine Cloud-Daten gefunden'); render(); if(state.settingsOpen) renderSettingsModal(); break; }
    case 'dbx-push': { const ok=await dbxSaveToCloud(true); toast(ok?'In Dropbox gespeichert':'Fehler beim Speichern'); if(state.settingsOpen) renderSettingsModal(); break; }
    case 'dbx-disconnect': await dbxDisconnect(); break;
    case 'export-backup': exportBackup(); break;
    case 'import-backup': document.getElementById('backup-file')?.click(); break;
  }
});
window.addEventListener('keydown',e=>{ if(e.key==='Escape' && document.getElementById('modal-root').innerHTML) closeModal(); });

/* ---------------------------- Bootstrap ---------------------------- */
(async function init(){
  await loadAll();
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='';
  render();
})();
</script>
